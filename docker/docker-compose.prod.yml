services:
  server:
    container_name: "${PROJECT_NAME}"
    env_file: .env
    image: ghcr.io/publishername/merocoffee:${PROJECT_VERSION}
    ports:
      - "8000:8000"
      - "2222:2222"
    networks:
      - default
      - external-services

  celery_worker:
    env_file: .env
    environment:
      - CELERY_WORKER=true
    image: ghcr.io/publishername/merocoffee:${PROJECT_VERSION}
    networks:
      - default
      - external-services
networks:
  external-services:
    external: true
