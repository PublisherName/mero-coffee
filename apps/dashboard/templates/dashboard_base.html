{% extends "base.html" %}
{% block title %}
    Dashboard - MeroCoffee
{% endblock title %}
{% block content %}
    <div class="dash-container">
        <div class="dash-layout">
            <aside class="dash-sidebar">
                <div class="dash-sidebar-card">
                    <nav class="dash-nav">
                        <a href="{% url 'dashboard:dashboard' %}"
                           class="dash-nav-link {% if request.resolver_match.url_name == 'dashboard' %}dash-nav-link--active{% endif %}">
                            <svg class="dash-nav-icon"
                                 width="18"
                                 height="18"
                                 viewBox="0 0 24 24"
                                 fill="none"
                                 stroke="currentColor"
                                 stroke-width="2"
                                 stroke-linecap="round"
                                 stroke-linejoin="round">
                                <rect x="3" y="3" width="7" height="7" /><rect x="14" y="3" width="7" height="7" /><rect x="14" y="14" width="7" height="7" /><rect x="3" y="14" width="7" height="7" />
                            </svg>
                            Overview
                        </a>
                        <a href="{% url 'dashboard:profile_settings' %}"
                           class="dash-nav-link {% if request.resolver_match.url_name == 'profile_settings' %}dash-nav-link--active{% endif %}">
                            <svg class="dash-nav-icon"
                                 width="18"
                                 height="18"
                                 viewBox="0 0 24 24"
                                 fill="none"
                                 stroke="currentColor"
                                 stroke-width="2"
                                 stroke-linecap="round"
                                 stroke-linejoin="round">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                                <circle cx="12" cy="7" r="4" />
                            </svg>
                            Profile
                        </a>
                        <a href="{% url 'dashboard:supporters' %}"
                           class="dash-nav-link {% if request.resolver_match.url_name == 'supporters' %}dash-nav-link--active{% endif %}">
                            <svg class="dash-nav-icon"
                                 width="18"
                                 height="18"
                                 viewBox="0 0 24 24"
                                 fill="none"
                                 stroke="currentColor"
                                 stroke-width="2"
                                 stroke-linecap="round"
                                 stroke-linejoin="round">
                                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
                                <circle cx="9" cy="7" r="4" />
                                <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
                                <path d="M16 3.13a4 4 0 0 1 0 7.75" />
                            </svg>
                            Supporters
                        </a>
                        <a href="{% url 'dashboard:earnings' %}"
                           class="dash-nav-link {% if request.resolver_match.url_name == 'earnings' %}dash-nav-link--active{% endif %}">
                            <svg class="dash-nav-icon"
                                 width="18"
                                 height="18"
                                 viewBox="0 0 24 24"
                                 fill="none"
                                 stroke="currentColor"
                                 stroke-width="2"
                                 stroke-linecap="round"
                                 stroke-linejoin="round">
                                <line x1="12" y1="1" x2="12" y2="23" />
                                <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6" />
                            </svg>
                            Earnings
                        </a>
                        <a href="{% url 'dashboard:withdrawal' %}"
                           class="dash-nav-link {% if request.resolver_match.url_name == 'withdrawal' %}dash-nav-link--active{% endif %}">
                            <svg class="dash-nav-icon"
                                 width="18"
                                 height="18"
                                 viewBox="0 0 24 24"
                                 fill="none"
                                 stroke="currentColor"
                                 stroke-width="2"
                                 stroke-linecap="round"
                                 stroke-linejoin="round">
                                <rect x="1" y="4" width="22" height="16" rx="2" ry="2" /><line x1="1" y1="10" x2="23" y2="10" />
                            </svg>
                            Withdrawal
                        </a>
                        <a href="{% url 'dashboard:kyc' %}"
                           class="dash-nav-link {% if request.resolver_match.url_name == 'kyc' %}dash-nav-link--active{% endif %}">
                            <svg class="dash-nav-icon"
                                 width="18"
                                 height="18"
                                 viewBox="0 0 24 24"
                                 fill="none"
                                 stroke="currentColor"
                                 stroke-width="2"
                                 stroke-linecap="round"
                                 stroke-linejoin="round">
                                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
                            </svg>
                            Verification
                        </a>
                    </nav>
                </div>
            </aside>
            <main class="dash-main">
                {% block main_content %}
                {% endblock main_content %}
            </main>
        </div>
    </div>
{% endblock content %}
