{% extends "base.html" %}
{% block title %}
    Dashboard - MeroCoffee
{% endblock title %}
{% block content %}
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="flex flex-col lg:flex-row gap-8">
            <!-- Sidebar -->
            <aside class="lg:w-64">
                <div class="bg-gradient-card rounded-xl shadow-lg border border-surface/50 p-6 sticky top-24">
                    <nav class="space-y-2">
                        <a href="{% url 'dashboard:dashboard' %}"
                           class="block px-4 py-3 rounded-lg font-medium transition-all duration-300 {% if request.resolver_match.url_name == 'dashboard' %}bg-gradient-accent-r text-white shadow-lg{% else %}text-body hover:bg-surface/50{% endif %}">
                            Overview
                        </a>
                        <a href="{% url 'dashboard:profile_settings' %}"
                           class="block px-4 py-3 rounded-lg font-medium transition-all duration-300 {% if request.resolver_match.url_name == 'profile_settings' %}bg-gradient-accent-r text-white shadow-lg{% else %}text-body hover:bg-surface/50{% endif %}">
                            Profile
                        </a>
                        <a href="{% url 'dashboard:supporters' %}"
                           class="block px-4 py-3 rounded-lg font-medium transition-all duration-300 {% if request.resolver_match.url_name == 'supporters' %}bg-gradient-accent-r text-white shadow-lg{% else %}text-body hover:bg-surface/50{% endif %}">
                            Supporters
                        </a>
                        <a href="{% url 'dashboard:earnings' %}"
                           class="block px-4 py-3 rounded-lg font-medium transition-all duration-300 {% if request.resolver_match.url_name == 'earnings' %}bg-gradient-accent-r text-white shadow-lg{% else %}text-body hover:bg-surface/50{% endif %}">
                            Earnings
                        </a>
                        <a href="{% url 'dashboard:withdrawal' %}"
                           class="block px-4 py-3 rounded-lg font-medium transition-all duration-300 {% if request.resolver_match.url_name == 'withdrawal' %}bg-gradient-accent-r text-white shadow-lg{% else %}text-body hover:bg-surface/50{% endif %}">
                            Withdrawal
                        </a>
                        <a href="{% url 'dashboard:kyc' %}"
                           class="block px-4 py-3 rounded-lg font-medium transition-all duration-300 {% if request.resolver_match.url_name == 'kyc' %}bg-gradient-accent-r text-white shadow-lg{% else %}text-body hover:bg-surface/50{% endif %}">
                            Verification
                        </a>
                    </nav>
                </div>
            </aside>
            <!-- Main Content -->
            <main class="flex-1">
                {% block main_content %}
                    <!-- Page-specific content will go here -->
                {% endblock main_content %}
            </main>
        </div>
    </div>
{% endblock content %}
