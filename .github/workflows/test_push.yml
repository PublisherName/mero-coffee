name: Tests

on:
  push:
    branches: [develop]
  workflow_run:
    workflows: ["Lint"]
    types:
      - completed
env:
  IMAGE_ID: ghcr.io/${{ github.repository_owner }}/merocoffee
  DOCKER_BUILDKIT: 1

jobs:
  test-django:
    name: Run Django Tests
    runs-on: ubuntu-latest
    env:
      NPM_BIN_PATH: /usr/local/bin/npm

    strategy:
      matrix:
        node-version: [25.x]
        uv-version: [0.9.5]
        python-version: [3.13]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix['python-version'] }}

      - name: Use Node.js ${{ matrix['node-version'] }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix['node-version'] }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ matrix['uv-version'] }}
          enable-cache: true

      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            .venv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install dependencies
        run: uv sync --frozen --extra development --no-install-project

      - name: Copy env example to env
        run: cp .env.test.example .env

      - name: Install tailwind
        run: uv run manage.py tailwind install

      - name: Run migrations
        run: uv run python manage.py migrate

      - name: Seed payment gateways
        run: uv run python manage.py seed_payment_gateways

      - name: Run tests
        run: uv run python manage.py test --verbosity=2

  docker-test:
    needs: test-django
    name: Docker Compose Tests
    runs-on: ubuntu-latest
    env:
      SERVER_ENVIRONMENT: "testing"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy env example to env
        run: cp .env.test.example .env

      - name: Initial external services setup
        run: |
          docker network create external-services
          ln -s docker/external_services.yml external_services.yml
          docker compose -f external_services.yml up -d
          ln -s docker/docker-compose.test.yml docker-compose.yml
      - name: Run test
        run: |
          docker compose up --exit-code-from server

  push-image:
    needs: docker-test
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Copy .env files
        run: cp .env.prod.example .env

      - name: Build image
        run: |
          docker build . --file Dockerfile --tag merocoffee --target production \
            --progress=plain --build-arg BUILDKIT_INLINE_CACHE=1 \
            --cache-from $(echo $IMAGE_ID | tr '[A-Z]' '[a-z]'):develop

      - name: Log in to registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push image
        run: |
          IMAGE_ID=$(echo $IMAGE_ID | tr '[A-Z]' '[a-z]')
          VERSION=$(echo "${{ github.ref }}" | sed -e 's,.*/\(.*\),\1,')
          [[ "${{ github.ref }}" == "refs/tags/"* ]] && VERSION=$(echo $VERSION | sed -e 's/^v//')
          echo VERSION=$VERSION
          docker tag merocoffee $IMAGE_ID:$VERSION
          docker push $IMAGE_ID:$VERSION
