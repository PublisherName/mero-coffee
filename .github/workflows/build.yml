name: Build and Deploy

on:
  push:
    branches: [develop]
  workflow_run:
    workflows: ["Lint", "Test"]
    types:
      - completed
env:
  IMAGE_ID: ghcr.io/${{ github.repository_owner }}/merocoffee
  DOCKER_BUILDKIT: 1

jobs:
  docker-test:
    name: Docker Compose Tests
    runs-on: ubuntu-latest
    env:
      SERVER_ENVIRONMENT: "testing"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy env example to env
        run: cp .env.test.example .env

      - name: Initial external services setup
        run: |
          docker network create external-services
          ln -s docker/external_services.yml external_services.yml
          docker compose -f external_services.yml up -d
          ln -s docker/docker-compose.test.yml docker-compose.yml
      - name: Run test
        run: |
          docker compose up --exit-code-from server

  push-image:
    needs: docker-test
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Copy .env files
        run: cp .env.prod.example .env

      - name: Build image
        run: |
          docker build . --file Dockerfile --tag merocoffee --target production \
            --progress=plain --build-arg BUILDKIT_INLINE_CACHE=1 \
            --cache-from $(echo $IMAGE_ID | tr '[A-Z]' '[a-z]'):develop

      - name: Log in to registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push image
        run: |
          IMAGE_ID=$(echo $IMAGE_ID | tr '[A-Z]' '[a-z]')
          VERSION=$(echo "${{ github.ref }}" | sed -e 's,.*/\(.*\),\1,')
          [[ "${{ github.ref }}" == "refs/tags/"* ]] && VERSION=$(echo $VERSION | sed -e 's/^v//')
          echo VERSION=$VERSION
          docker tag merocoffee $IMAGE_ID:$VERSION
          docker push $IMAGE_ID:$VERSION

  deploy:
    needs: push-image
    runs-on: ubuntu-latest
    steps:
      - name: SSH into host and run command
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: ${{ secrets.DEPLOY_COMMAND }}
