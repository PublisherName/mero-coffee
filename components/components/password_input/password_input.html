<div class="password-input-container {{ container_class }}">
    {% if label %}
    <label for="{{ field_id }}" class="password-input-label">
        {{ label }}
        {% if required %}
        <span class="password-input-required">*</span>
        {% endif %}
    </label>
    {% endif %}

    <div class="password-input-wrapper">
        <input 
            type="password" 
            id="{{ field_id }}" 
            name="{{ name }}" 
            class="{{ input_classes }} password-input-field"
            placeholder="{{ placeholder }}"
            {% if required %}required{% endif %}
        >
        
        <button 
            type="button" 
            class="password-toggle-btn"
            onclick="togglePassword('{{ field_id }}')"
        >
            <svg id="{{ field_id }}-eye-open" class="password-toggle-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
            </svg>
            <svg id="{{ field_id }}-eye-closed" class="password-toggle-icon" style="display: none;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"></path>
            </svg>
        </button>
    </div>

    {% if help_text %}
    <p class="password-input-help">{{ help_text }}</p>
    {% endif %}

    {% if errors %}
    <div class="password-input-errors">
        {% for error in errors %}
        <p class="password-input-error">
            <svg class="password-input-error-icon" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd" />
            </svg>
            {{ error }}
        </p>
        {% endfor %}
    </div>
    {% endif %}
</div>

{% load static %}
<link rel="stylesheet" href="{% static 'css/components/password_input.css' %}">
<script src="{% static 'js/components/password_input/password_input.js' %}"></script>
