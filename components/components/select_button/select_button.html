<div style="display: flex; flex-direction: column; gap: 0.5rem;" class="{{ container_class }}">
    {# Label #}
    {% if label %}
    <label for="{{ field_id }}"
        style="display: block; font-size: 0.875rem; font-weight: 500; color: #cbd5e1; margin-bottom: 0.5rem;">
        {{ label }}
        {% if required %}
        <span style="color: #ef4444; margin-left: 0.25rem;">*</span>
        {% endif %}
    </label>
    {% endif %}

    {# Select Container with Custom Arrow #}
    <div style="position: relative; display: block;">
        <select id="{{ field_id }}" name="{{ name }}" class="{{ select_classes }}" {% if required %}required{% endif %}
            {% if disabled %}disabled{% endif %}>
            {# Placeholder Option #}
            {% if placeholder %}
            <option value="" {% if not selected %}selected{% endif %} disabled>
                {{ placeholder }}
            </option>
            {% endif %}

            {# Options #}
            {% for value, display_text in choices %}
            <option value="{{ value }}" {% if value == selected or value|stringformat:"s" == selected|stringformat:"s" %}selected{% endif %}>
                {{ display_text }}
            </option>
            {% endfor %}
        </select>

        {# Custom Dropdown Arrow Icon #}
        <div
            style="pointer-events: none; position: absolute; top: 0; bottom: 0; right: 0; display: flex; align-items: center; padding-left: 1rem; padding-right: 1rem; color: #94a3b8;">
            <svg style="height: 1.25rem; width: 1.25rem; transition: transform 0.2s;" fill="none" stroke="currentColor"
                viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
            </svg>
        </div>
    </div>

    {# Help Text #}
    {% if help_text %}
    <p style="font-size: 0.875rem; color: #64748b; margin-top: 0.25rem;">{{ help_text }}</p>
    {% endif %}

    {# Error Messages #}
    {% if errors %}
    <div
        style="font-size: 0.875rem; color: #ef4444; margin-top: 0.25rem; display: flex; flex-direction: column; gap: 0.25rem;">
        {% for error in errors %}
        <p style="display: flex; align-items: center; gap: 0.25rem;">
            <svg style="height: 1rem; width: 1rem;" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd"
                    d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z"
                    clip-rule="evenodd" />
            </svg>
            {{ error }}
        </p>
        {% endfor %}
    </div>
    {% endif %}
</div>

{% load static %}
<link rel="stylesheet" href="{% static 'css/components/select_button.css' %}">
