<div class="image-upload-container {{ container_class }}">
    <label for="{{ field_id }}" class="image-upload-label">
        {{ label }}
        {% if required %}<span class="image-upload-required">*</span>{% endif %}
    </label>
    <div class="image-upload-dropzone group" onclick="document.getElementById('{{ field_id }}').click()">

        <!-- Preview Image Container -->
        <img id="preview-{{ field_id }}"
             src="#"
             alt="Preview"
             class="image-upload-preview hidden"
             width="300"
             height="200">

        <!-- Change Overlay (visible when preview is active) -->
        <div id="change-overlay-{{ field_id }}" class="image-upload-change-overlay hidden">
            <span>Change Image</span>
        </div>

        <!-- Upload Placeholder -->
        <div id="placeholder-{{ field_id }}" class="image-upload-placeholder">
            <svg class="image-upload-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z">
                </path>
            </svg>
            <p class="image-upload-text">Click to upload {{ label }}</p>
            <p class="image-upload-hint">PNG, JPG up to 5MB</p>
        </div>

        <!-- Hidden File Input -->
        {{ field }}
    </div>

    {% if help_text %}<p class="image-upload-help">{{ help_text }}</p>{% endif %}

    <div class="image-upload-errors" id="{{ field_id }}-errors">
        {% if errors %}
            {% for error in errors %}
                <p class="image-upload-error">
                    <svg class="image-upload-error-icon" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd" />
                    </svg>
                    {{ error }}
                </p>
            {% endfor %}
        {% endif %}
    </div>
</div>

{% load static %}
<link rel="stylesheet" href="{% static 'css/components/image_upload.css' %}">
<script src="{% static 'js/components/image_upload.js' %}"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        setupImageUpload('{{ field_id }}');
    });
</script>
