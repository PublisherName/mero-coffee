[project]
name = "coffee"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dj-database-url>=2.1.0",
    "dj-email-url>=1.0.6",
    "django>=5.2.8",
    "django-admin-honeypot-updated-2021>=1.2.0",
    "django-defender>=0.9.8",
    "django-jazzmin>=3.0.1",
    "django-ratelimit>=4.1.0",
    "django-redis>=6.0.0",
    "django-viewcomponent>=1.0.11",
    "environs[django]>=14.5.0",
    "marshmallow>=4.1.0",
    "pillow>=12.0.0",
    "psycopg2-binary>=2.9.9",
    "requests>=2.32.5",
    "whitenoise>=6.11.0",
]

[project.optional-dependencies]
production = [
    "django-tailwind>=4.4.1",
    "gunicorn>=23.0.0",
    "uvicorn>=0.38.0",
]
development = [
    "django-tailwind[cookiecutter,honcho,reload]>=4.4.1",
    "djlint>=1.36.4",
    "pre-commit>=4.3.0",
    "ruff>=0.14.2",
]

[tool.ruff]
line-length = 99
force-exclude = true
extend-exclude = ["migrations"]

[tool.ruff.lint]
preview=true
extend-select = ["C", "E", "F", "I001", "PLR6301", "Q", "SIM", "T", "W"]
ignore = ["SIM108"]


[tool.ruff.format]
indent-style = "space"
docstring-code-format = true
docstring-code-line-length = 20

[tool.ruff.lint.flake8-quotes]
inline-quotes = "double"
multiline-quotes = "double"
docstring-quotes = "double"
