{% extends "base.html" %}
{% block title %}
    Login - MeroCoffee
{% endblock title %}
{% block content %}
    <div class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 bg-gradient-to-b from-slate-900 to-slate-800">
        <div class="max-w-md w-full">
            <div class="bg-gradient-to-br from-slate-800 to-slate-900 p-8 rounded-xl shadow-2xl border border-slate-700/50">
                <div class="flex items-center justify-center mb-6">
                    <span class="text-4xl">✨</span>
                </div>
                <h2 class="text-3xl font-bold text-center mb-2 text-white">Welcome Back</h2>
                <p class="text-center text-slate-400 mb-8">Login to your MeroCoffee account</p>
                <form method="post" class="space-y-5">
                    {% csrf_token %}
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">Username or Email</label>
                        <input type="text"
                               name="username"
                               required
                               class="w-full px-4 py-3 bg-slate-900/50 border border-slate-700 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:border-red-500 focus:ring-2 focus:ring-red-500/50 transition-all duration-300">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">Password</label>
                        <input type="password"
                               name="password"
                               required
                               class="w-full px-4 py-3 bg-slate-900/50 border border-slate-700 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:border-red-500 focus:ring-2 focus:ring-red-500/50 transition-all duration-300">
                    </div>
                    <div class="flex items-center justify-between">
                        <label class="flex items-center">
                            <input type="checkbox"
                                   name="remember"
                                   class="w-4 h-4 bg-slate-900 border border-slate-700 rounded focus:ring-2 focus:ring-red-500 cursor-pointer">
                            <span class="ml-2 text-sm text-slate-400">Remember me</span>
                        </label>
                        <a href="#/password-reset/"
                           class="text-sm text-red-500 hover:text-orange-500 transition-colors">Forgot password?</a>
                    </div>
                    <button type="submit"
                            class="w-full bg-gradient-to-r from-red-500 to-orange-600 text-white py-3 rounded-lg font-semibold hover:shadow-2xl hover:shadow-red-500/50 hover:-translate-y-1 transition-all duration-300">
                        Login
                    </button>
                </form>
                <p class="text-center text-sm text-slate-400 mt-6">
                    Don't have an account? <a href="{% url 'accounts:signup' %}"
    class="text-red-500 hover:text-orange-500 transition-colors font-semibold">Sign up</a>
                </p>
            </div>
        </div>
    </div>
{% endblock content %}
