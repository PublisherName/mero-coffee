{% extends "base.html" %}
{% block title %}
    Sign Up - MeroCoffee
{% endblock title %}
{% block content %}
    <div class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 bg-gradient-to-b from-slate-900 to-slate-800">
        <div class="max-w-md w-full">
            <div class="bg-gradient-to-br from-slate-800 to-slate-900 p-8 rounded-xl shadow-2xl border border-slate-700/50">
                <div class="flex items-center justify-center mb-6">
                    <span class="text-4xl">✨</span>
                </div>
                <h2 class="text-3xl font-bold text-center mb-2 text-white">Create Your Account</h2>
                <p class="text-center text-slate-400 mb-8">Join the MeroCoffee community</p>
                <form method="post" class="space-y-5">
                    {% csrf_token %}
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">Full Name</label>
                        <input type="text"
                               name="full_name"
                               required
                               class="w-full px-4 py-3 bg-slate-900/50 border border-slate-700 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:border-red-500 focus:ring-2 focus:ring-red-500/50 transition-all duration-300">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">Email</label>
                        <input type="email"
                               name="email"
                               required
                               class="w-full px-4 py-3 bg-slate-900/50 border border-slate-700 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:border-red-500 focus:ring-2 focus:ring-red-500/50 transition-all duration-300">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">Username</label>
                        <input type="text"
                               name="username"
                               required
                               class="w-full px-4 py-3 bg-slate-900/50 border border-slate-700 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:border-red-500 focus:ring-2 focus:ring-red-500/50 transition-all duration-300">
                        <p class="text-xs text-slate-500 mt-1">Your page: merocoffee.com/username</p>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">Password</label>
                        <input type="password"
                               name="password"
                               required
                               class="w-full px-4 py-3 bg-slate-900/50 border border-slate-700 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:border-red-500 focus:ring-2 focus:ring-red-500/50 transition-all duration-300">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">Confirm Password</label>
                        <input type="password"
                               name="password2"
                               required
                               class="w-full px-4 py-3 bg-slate-900/50 border border-slate-700 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:border-red-500 focus:ring-2 focus:ring-red-500/50 transition-all duration-300">
                    </div>
                    <div class="flex items-start">
                        <input type="checkbox"
                               name="terms"
                               required
                               class="mt-1 mr-3 w-4 h-4 bg-slate-900 border border-slate-700 rounded focus:ring-2 focus:ring-red-500 cursor-pointer">
                        <label class="text-sm text-slate-400">
                            I agree to the <a href="#" class="text-red-500 hover:text-orange-500 transition-colors">Terms of Service</a> and <a href="#" class="text-red-500 hover:text-orange-500 transition-colors">Privacy Policy</a>
                        </label>
                    </div>
                    <button type="submit"
                            class="w-full bg-gradient-to-r from-red-500 to-orange-600 text-white py-3 rounded-lg font-semibold hover:shadow-2xl hover:shadow-red-500/50 hover:-translate-y-1 transition-all duration-300">
                        Create Account
                    </button>
                </form>
                <p class="text-center text-sm text-slate-400 mt-6">
                    Already have an account? <a href="{% url 'accounts:login' %}"
    class="text-red-500 hover:text-orange-500 transition-colors font-semibold">Login</a>
                </p>
            </div>
        </div>
    </div>
{% endblock content %}
