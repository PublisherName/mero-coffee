{% extends "base.html" %}
{% block title %}
    Password Reset Complete - MeroCoffee
{% endblock title %}
{% block content %}
    <div class="min-h-screen flex items-center justify-center bg-gradient-to-b from-slate-900 to-slate-800 px-4 sm:px-6 lg:px-8 py-20">
        <div class="max-w-md w-full bg-gradient-to-br from-slate-800 to-slate-900 p-12 rounded-xl shadow-2xl border border-slate-700/50 text-center">
            <h2 class="text-3xl font-bold text-white mb-4">Password Reset Successful</h2>
            <p class="text-slate-400 mb-6">Your password has been updated. You can now log in with your new password.</p>
            <a href="{% url 'accounts:login' %}"
               class="inline-block bg-gradient-to-r from-red-500 to-orange-600 text-white px-10 py-3 rounded-lg font-semibold hover:shadow-lg hover:shadow-red-500/50 transition-all duration-300">
                Go to Login
            </a>
        </div>
    </div>
{% endblock content %}
