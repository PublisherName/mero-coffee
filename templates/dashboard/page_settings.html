{% extends "dashboard/base.html" %}
{% block title %}
    Page Settings - MeroCoffee
{% endblock title %}
{% block main_content %}
    <div class="max-w-3xl mx-auto bg-gradient-to-br from-slate-800 to-slate-900 rounded-xl shadow-lg border border-slate-700/50 p-8">
        <h1 class="text-3xl font-bold text-white mb-6">Page Settings</h1>
        <form method="post" novalidate class="space-y-6">
            {% csrf_token %}
            {% include "includes/messages.html" %}
            <div>
                <label for="display_name"
                       class="block text-sm font-medium text-slate-300 mb-1">Display Name</label>
                <input type="text"
                       name="display_name"
                       id="display_name"
                       value="{{ settings.display_name|default_if_none:'' }}"
                       class="w-full px-4 py-3 bg-slate-900/50 border border-slate-700 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:border-red-500 focus:ring-2 focus:ring-red-500/50 transition-all duration-300" />
            </div>
            <div>
                <label for="bio" class="block text-sm font-medium text-slate-300 mb-1">Bio</label>
                <textarea name="bio"
                          id="bio"
                          rows="4"
                          class="w-full px-4 py-3 bg-slate-900/50 border border-slate-700 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:border-red-500 focus:ring-2 focus:ring-red-500/50 transition-all duration-300 resize-none">{{ settings.bio|default_if_none:'' }}</textarea>
            </div>
            <div>
                <label for="avatar_url"
                       class="block text-sm font-medium text-slate-300 mb-1">Avatar URL</label>
                <input type="url"
                       name="avatar_url"
                       id="avatar_url"
                       value="{{ settings.avatar_url|default_if_none:'' }}"
                       class="w-full px-4 py-3 bg-slate-900/50 border border-slate-700 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:border-red-500 focus:ring-2 focus:ring-red-500/50 transition-all duration-300" />
            </div>
            <div>
                <label for="coffee_price"
                       class="block text-sm font-medium text-slate-300 mb-1">Coffee Price (Rs.)</label>
                <input type="number"
                       name="coffee_price"
                       id="coffee_price"
                       min="1"
                       value="{{ settings.coffee_price|default:100 }}"
                       class="w-full px-4 py-3 bg-slate-900/50 border border-slate-700 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:border-red-500 focus:ring-2 focus:ring-red-500/50 transition-all duration-300" />
            </div>
            <button type="submit"
                    class="px-6 py-3 bg-gradient-to-r from-red-500 to-orange-600 text-white rounded-lg font-semibold hover:shadow-lg hover:shadow-red-500/50 transition-all duration-300">
                Save Changes
            </button>
        </form>
    </div>
{% endblock main_content %}
